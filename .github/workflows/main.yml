name: CI Test Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Set up Python version 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies (pytest)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f campus_agent/requirements.txt ]; then pip install -r campus_agent/requirements.txt; fi

      # 4. Run the tests using pytest
      - name: Run the tests using pytest
        run: |
          # Change directory if your tests are inside campus_agent
          cd campus_agent
          pytest -v
